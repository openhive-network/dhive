stages:
  - test
  - release

image: node:16.17.0

lint:
  stage: test
  script:
    - yarn install --frozen-lockfile
    - yarn run lint

node-test:
  stage: test
  image: $IMAGE
  script:
    - yarn install --frozen-lockfile
    - yarn run test
  parallel:
    matrix:
      - IMAGE:
          - node:14
          - node:16

browser-test:
  stage: test
  image: weboaks/node-karma-protractor-chrome:debian-node16
  script:
    - yarn install --frozen-lockfile
    - yarn run build
    - yarn run test:browser-in-docker

coverage:
  stage: test
  script:
    - yarn install --frozen-lockfile
    - yarn run test:coverage
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - coverage/lcov-report/
    reports:
      junit: coverage/junit-coverage.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

pages: # generate docs
  stage: release
  script:
    - yarn install --frozen-lockfile
    - npx typedoc --out public src
  artifacts:
    paths:
      - public

publish:
  stage: release
  script:
    - apt update && apt install zip -y
    - yarn install --frozen-lockfile
    - yarn run build
    - zip dist dist/*
    - yarn run semantic-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
